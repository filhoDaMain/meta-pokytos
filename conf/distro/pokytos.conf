# Pokytos Distribution based on poky
include conf/distro/poky.conf

DISTRO = "pokytos"
DISTRO_NAME = "Pokytos - A small embedded distro"
DISTRO_VERSION = "1.0.0"
SDK_VENDOR = "-pokytossdk"
SDK_VERSION = "${@d.getVar('DISTRO_VERSION').replace('snapshot-${METADATA_REVISION}', 'snapshot')}"
SDK_VERSION[vardepvalue] = "${SDK_VERSION}"
MAINTAINER = "Andre Temprilho (filhoDaMain)"

PACKAGE_CLASSES = "package_ipk"
INIT_MANAGER = "systemd"

# Kernel
PREFERRED_PROVIDER_virtual/kernel="linux-stable"

# Specific to RPI (maybe move to an inc file later)
RPI_USE_U_BOOT:rpi = "1"
ENABLE_UART:rpi = "1"
# Required to use WiFi and BT firmware
LICENSE_FLAGS_ACCEPTED:rpi = "synaptics-killswitch"

